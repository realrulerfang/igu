<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Super Iguana with Bluechip on Base</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6EFFF; --bg2:#D3E3FF; --ink:#0A1B44; --base:#0052FF; --card:#ffffff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#E6EFFF; --bg2:#D3E3FF; --ink:#0A1B44; }
}
*{box-sizing:border-box}
html{height:100%}
body{
  margin:0; min-height:100%;
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color:var(--ink);
  background:var(--bg);
  background-image:
    radial-gradient(900px 500px at 50% -10%, #ffffff 0%, transparent 70%),
    radial-gradient(700px 500px at 50% 110%, var(--bg2) 0%, transparent 70%);
  background-attachment:fixed;
}
main{
  min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:28px; padding:40px 20px; text-align:center;
}
h1{
  margin:0; font-weight:800; letter-spacing:-0.03em; line-height:1.05;
  font-size:clamp(34px,7vw,72px); max-width:900px; color:var(--ink);
}
h1 .base{color:var(--base)}
.photo{
  width:min(92vw,520px); aspect-ratio:1/1; border-radius:28px; overflow:hidden;
  background:var(--card);
  box-shadow:0 0 0 6px #fff, 0 0 0 8px var(--base), 0 30px 60px -20px rgba(0,82,255,.45);
}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.ca{
  display:inline-flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:center;
  background:var(--base); color:#fff; font-weight:700; font-size:clamp(16px,3.4vw,22px);
  padding:14px 26px; border-radius:999px; max-width:100%;
  word-break:break-all;
}
.ca [contenteditable]{outline:none; min-width:2ch; font-weight:500; opacity:.95}
.ca [contenteditable]:focus-visible{outline:2px solid #fff; outline-offset:4px; border-radius:6px}
@media (prefers-reduced-motion:no-preference){
  .photo{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
}
</style>
</head>
